<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Neon Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glass Cabin Gradient -->
    <linearGradient id="cabinGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Floor Display Glow -->
    <linearGradient id="displayGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#0ea5e9" stroke-width="6" stroke-opacity="0.8"/>
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Shaft Vertical Guide Rails -->
  <line x1="110" y1="80" x2="110" y2="432" stroke="#334155" stroke-width="6" stroke-dasharray="16,8"/>
  <line x1="402" y1="80" x2="402" y2="432" stroke="#334155" stroke-width="6" stroke-dasharray="16,8"/>

  <!-- Suspension Cables -->
  <line x1="216" y1="40" x2="216" y2="135" stroke="#94a3b8" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="256" y1="40" x2="256" y2="135" stroke="#94a3b8" stroke-width="3" stroke-opacity="0.75"/>
  <line x1="296" y1="40" x2="296" y2="135" stroke="#94a3b8" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Elevator Cabin Body -->
  <rect x="140" y="135" width="232" height="255" rx="28" fill="url(#cabinGlass)" stroke="#06b6d4" stroke-width="8" filter="url(#glow)"/>

  <!-- Central Door Joint / Gap -->
  <line x1="256" y1="210" x2="256" y2="375" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Door Protection Edge Glow -->
  <rect x="156" y="215" width="4" height="150" rx="2" fill="#38bdf8" opacity="0.4"/>
  <rect x="352" y="215" width="4" height="150" rx="2" fill="#38bdf8" opacity="0.4"/>

  <!-- Upper Indicator Panel Display -->
  <rect x="160" y="152" width="192" height="48" rx="10" fill="url(#displayGlow)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Direction Arrows -->
  <polygon points="190,182 176,182 183,166" fill="#10b981"/>
  <polygon points="322,168 336,168 329,184" fill="#f59e0b"/>

  <!-- Position Digit / Floor "K2" -->
  <text x="256" y="186" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="2">EDEL</text>

  <!-- Big Central Brand Label -->
  <text x="256" y="295" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">EDEL</text>

  <!-- Subtitle Badge: K2 • EN 81-20 -->
  <g transform="translate(181, 320)">
    <rect x="0" y="0" width="150" height="28" rx="8" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="75" y="19" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">K2 • EN81-20</text>
  </g>
</svg>
