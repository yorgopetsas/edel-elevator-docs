<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDEL Elevator Controller — Technical & Engineering Documentation Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="nav-brand">
      <div class="logo-badge">K2 / EDEL</div>
      <div class="brand-titles">
        <span class="brand-name">EDELElevator Controller System</span>
        <span class="brand-version">Firmware v4.4.0 / v0.6.2 — HCS12 / S12X</span>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search C modules, state machines, parameters, fault codes, CAN frames..." />
      <span class="search-kbd">Ctrl + K</span>
    </div>

    <div class="nav-actions">
      <div class="lang-switch-group" id="langSwitchGroup">
        <button class="lang-btn active" id="langBtnEs" data-lang="es" title="Versión en Español">
          <span>🇪🇸</span> ES
        </button>
        <button class="lang-btn" id="langBtnEn" data-lang="en" title="English Version">
          <span>🇬🇧</span> EN
        </button>
      </div>

      <a href="pending_tasks.md" target="_blank" class="tasks-badge-btn" id="pendingTasksLink" title="Ver Tareas de Ingeniería Pendientes">
        <span class="tasks-icon">📋</span> <span id="pendingTasksText">Tareas Pendientes</span>
      </a>
      <button class="theme-toggle" id="themeToggleBtn" title="Toggle Light/Dark Theme">
        <span class="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <!-- Role Selector Switcher -->
  <div class="role-bar">
    <div class="role-selector">
      <button class="role-btn active" data-role="dev">
        <span class="role-icon">🧑‍💻</span>
        <div class="role-info">
          <span class="role-title">1. Developer Portal</span>
          <span class="role-desc">Deep Code Architecture, Modules & State Machines</span>
        </div>
      </button>
      
      <button class="role-btn" data-role="tech">
        <span class="role-icon">🛠️</span>
        <div class="role-info">
          <span class="role-title">2. EDEL In-House Tech Support</span>
          <span class="role-desc">Specialized Diagnostics, Flashing, Bench Test & Tokens</span>
        </div>
      </button>
      
      <button class="role-btn" data-role="client">
        <span class="role-icon">🏢</span>
        <div class="role-info">
          <span class="role-title">3. Client Installers & Maintenance</span>
          <span class="role-desc">Commissioning, Wiring, Configuration & Troubleshooting</span>
        </div>
      </button>
    </div>
  </div>

  <!-- Main Workspace Layout -->
  <div class="main-container">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title" id="sidebarRoleTitle">Developer Documentation</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <!-- Injected dynamically based on selected role -->
      </nav>
    </aside>

    <!-- Content Workspace -->
    <main class="content-area" id="contentArea">
      <!-- Search Overlay (Hidden by default) -->
      <div id="searchResultsArea" class="search-results-overlay hidden">
        <h2>Search Results</h2>
        <div id="searchResultsList" class="results-list"></div>
      </div>

      <!-- Dynamic Documentation Content -->
      <div id="docBody"></div>
    </main>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <span>EDEL Elevator Controller Documentation System — K2 / AdvancedK2 / MdP Series</span>
      <span>MC9S12DT256 & MC9S12XDT512 • CodeWarrior HCS12 • EN81-20 Compliant</span>
    </div>
  </footer>

  <script src="data_es.js"></script>
  <script src="app.js"></script>
</body>
</html>
